apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-member-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-member
  template:
    metadata:
      labels:
        app: spring-member
    spec:
      containers:
        - name: spring-member
          image: ghcr.io/nageune123/spring-member:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /docker-test
              port: 8080
            periodSeconds: 5
            failureThreshold: 18

          readinessProbe:
            httpGet:
              path: /docker-test
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docker-test
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
